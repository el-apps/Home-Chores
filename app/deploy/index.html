<!DOCTYPE html>
<html>
  <head>
    <title>Home Chores</title>
    <meta charset="UTF-8">
    <meta name="description" content="A simple web app for tracking chores around the home.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- TODO: add favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/app.webmanifest">
    <link rel="stylesheet" href="/pico.cyan.min.css">
    <link rel="stylesheet" href="/app.css">
    <script src="elm.js"></script>
  </head>
  <body>
    <!-- This will get replaced by the elements generated by Elm -->
    <div id="root"></div>
    <script>
      var storageKey = "events";

      // Build some dummy event history to bootstrap the app
      var now = Date.now();
      var dayMs = 24 * 60 * 60 * 1000;

      function ev(uuid, ts, itemUuid, action, payload) {
        return {
          uuid: uuid,
          timestamp: ts,
          userUuid: "demo",
          itemUuid: itemUuid,
          action: action,
          payload: payload
        };
      }

      var events = [];
      var t = now - 5 * dayMs;

      var TRASH = "c892a6cb-cfbc-4d05-8888-28b54f0ffe90";
      events.push(ev("e1", t++, TRASH, "addChore", ""));
      events.push(ev("e2", t++, TRASH, "updateChore", JSON.stringify({ field: "type", value: "repeated_weekly" })));
      events.push(ev("e3", t++, TRASH, "updateChore", JSON.stringify({ field: "name", value: "Take out the trash" })));
      events.push(ev("e4", t++, TRASH, "updateChore", JSON.stringify({ field: "day", value: "Wed" })));
      events.push(ev("e5", t++, TRASH, "completeChore", JSON.stringify({ timestamp: now - 3 * dayMs })));

      var MOW = "228a6965-28e2-4026-b6a9-6c0cc4a57026";
      events.push(ev("e6", t++, MOW, "addChore", ""));
      events.push(ev("e7", t++, MOW, "updateChore", JSON.stringify({ field: "type", value: "repeated_weekly" })));
      events.push(ev("e8", t++, MOW, "updateChore", JSON.stringify({ field: "name", value: "Mow the yard" })));
      events.push(ev("e9", t++, MOW, "updateChore", JSON.stringify({ field: "day", value: "Tue" })));

      var ONE = "37d8e82b-bf25-4da6-85a7-5fb6c76b5002";
      events.push(ev("e10", t++, ONE, "addChore", ""));
      events.push(ev("e11", t++, ONE, "updateChore", JSON.stringify({ field: "type", value: "one_time" })));
      events.push(ev("e12", t++, ONE, "updateChore", JSON.stringify({ field: "name", value: "Allow the user to add one-time chores" })));

      var defaultEvents = events;

      function isValidEvents(x) {
        return Array.isArray(x) && x.every(function (ev) {
          return ev && typeof ev === "object"
            && "uuid" in ev
            && "timestamp" in ev
            && "userUuid" in ev
            && "itemUuid" in ev
            && "action" in ev
            && "payload" in ev;
        });
      }

      // Load from localStorage if present, else use defaults
      var persisted = localStorage.getItem(storageKey);
      var historyArr;
      try {
        var parsed = persisted ? JSON.parse(persisted) : defaultEvents;
        historyArr = isValidEvents(parsed) ? parsed : defaultEvents;
      } catch (e) {
        console.warn("Corrupt persisted data, falling back to defaults:", e);
        historyArr = defaultEvents;
      }

      var app = Elm.Main.init({
        node: document.getElementById('root'),
        flags: Date.now()
      });

      // Send initial event history to app
      app.ports.onNewHistory.send(historyArr);

      // When Elm sends a single new event, let JS generate uuid/timestamp, persist, and echo back the latest history
      app.ports.newEvent.subscribe(function (ev) {
        // TODO: push single event to sync server
        try {
          function makeUuid() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
              return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = Math.random() * 16 | 0;
              var v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          }

          // Build a full event object here. Elm sends a minimal object (no uuid/timestamp).
          var eventUuid = makeUuid();
          var timestamp = Date.now();
          var userUuid = ev && ev.userUuid ? ev.userUuid : "me";
          var itemUuid = ev && ev.itemUuid ? ev.itemUuid : (ev && ev.item) ? ev.item : null;
          var action = ev && ev.action ? ev.action : "completeChore";
          var payload = ev && ev.payload ? ev.payload : "{}";

          if (typeof payload !== "string") {
            try {
              payload = JSON.stringify(payload);
            } catch (e) {
              payload = String(payload);
            }
          }

          var fullEv = {
            uuid: eventUuid,
            timestamp: timestamp,
            userUuid: userUuid,
            itemUuid: itemUuid,
            action: action,
            payload: payload
          };

          // Load existing persisted history (fall back to defaults if corrupt/missing)
          var persisted = localStorage.getItem(storageKey);
          var historyArr;
          try {
            var parsed = persisted ? JSON.parse(persisted) : defaultEvents;
            historyArr = isValidEvents(parsed) ? parsed.slice() : defaultEvents.slice();
          } catch (e) {
            console.warn("Corrupt persisted data, falling back to defaults:", e);
            historyArr = defaultEvents.slice();
          }

console.log(fullEv);
          // Append the new event object
          historyArr.push(fullEv);

          // Persist updated history
          localStorage.setItem(storageKey, JSON.stringify(historyArr));

          // Send new history to app
          console.log(historyArr);
          app.ports.onNewHistory.send(historyArr);
        } catch (e) {
          console.warn("Failed to persist data to localStorage:", e);
          // Fallback: send defaults if possible
          try {
            app.ports.onNewHistory.send(defaultEvents);
          } catch (e2) {}
        }
      });
    </script>
  </body>
</html>
