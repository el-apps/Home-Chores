<!DOCTYPE html>
<html>
  <head>
    <title>Home Chores</title>
    <meta charset="UTF-8">
    <meta name="description" content="A simple web app for tracking chores around the home.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- TODO: add favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/app.webmanifest">
    <link rel="stylesheet" href="/pico.cyan.min.css">
    <link rel="stylesheet" href="/app.css">
    <script src="elm.js"></script>
  </head>
  <body>
    <!-- This will get replaced by the elements generated by Elm -->
    <div id="root"></div>
    <script>
      var storageKey = "store";

      // Some dummy initial data to bootstrap the app
      var defaultData = {
        chores: [
          { type: "repeated_weekly", uuid: "c892a6cb-cfbc-4d05-8888-28b54f0ffe90", name: "Take out the trash", day: "Wed" },
          { type: "repeated_weekly", uuid: "228a6965-28e2-4026-b6a9-6c0cc4a57026", name: "Mow the yard", day: "Tue" },
          { type: "one_time", uuid: "37d8e82b-bf25-4da6-85a7-5fb6c76b5002", name: "Allow the user to add one-time chores" }
        ],
        completedChores: [
          { choreUuid: "c892a6cb-cfbc-4d05-8888-28b54f0ffe90", timestamp: Date.now() - 2 * 24 * 60 * 60 * 1000 }
        ]
      };

      // Load from localStorage if present, else use defaults
      var persisted = localStorage.getItem(storageKey);
      var historyObj;
      try {
        historyObj = persisted ? JSON.parse(persisted) : defaultData;
      } catch (e) {
        console.warn("Corrupt persisted data, falling back to defaults:", e);
        historyObj = defaultData;
      }

      var app = Elm.Main.init({
        node: document.getElementById('root'),
      });

      // Send initial history to app
      app.ports.onNewHistory.send(historyObj);

      // When Elm asks to push data, persist it and echo back as the latest history
      app.ports.pushData.subscribe(function(val) {
        // TODO: push data to sync server
        try {
          localStorage.setItem(storageKey, JSON.stringify(val));
        } catch (e) {
          console.warn("Failed to persist data to localStorage:", e);
        }

        // Send new history to app
        app.ports.onNewHistory.send(val);
      });
    </script>
  </body>
</html>
